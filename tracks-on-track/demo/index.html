    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#03070e" />
    <script>
      // Light or dark before anything draws: the person's choice on this device, else the device's setting.
      (function () {
        var t = null;
        try { t = localStorage.getItem('tot-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#eef0f4');
        // This person's background, remembered on this device (their account has the real choice).
        try {
          var bg = JSON.parse(localStorage.getItem('tot-bg') || 'null');
          if (bg && /^[a-z]+$/.test(bg.key)) {
            document.documentElement.dataset.bg = bg.key;
            if (bg.key === 'image') document.documentElement.style.setProperty('--bg-image', 'url("/api/me/background?v=' + encodeURIComponent(bg.v || 1) + '")');
          }
        } catch (e) {}
      })();
    </script>
