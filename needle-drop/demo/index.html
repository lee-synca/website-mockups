<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Needle Drop demo</title>
<meta name="robots" content="noindex">
<meta name="description" content="The Needle Drop demo: a made-up DJ's own music app.">
<meta name="theme-color" content="#0d0b0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ND Demo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js'));</script>
<style>
html,body{margin:0}
</style>
<meta name="theme-color" content="#0d0b0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: a streaming-app shell. Tab screens scroll under a floating mini player and a fading tab bar;
   mix pages and the full player take their colour from the cover. Gold is the brand's play colour. */
:root{
  --bg:#131110; --elev:#1e1b18; --elev2:#2a2621; --line:#38322b;
  --fg:#F2ECE2; --muted:#b3aa9b; --dim:#8f8678;
  --gold:#ff4fa3; --gold-ink:#16130F; --hib:#ff5d6c; --sea:#43c9b4;
  --font:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --brand:'Unbounded','Arial Black',Impact,sans-serif;
  --gut:16px; --navh:53px; --nb:max(2px,calc(env(safe-area-inset-bottom,0px) - 26px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html,body{background:#0d0b0a}
body{margin:0;color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.35;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ic{width:24px;height:24px;flex:none;display:block}
.tab{font-variant-numeric:tabular-nums}

.app{position:fixed;top:0;bottom:0;left:0;right:0;width:100%;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden;overflow:clip}
@media (min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
/* iPhone home-screen quirk: the page stops short of the screen bottom and iOS fills the rest in plain dark.
   The tab bar then needs no extra bottom space, and its colour matches that strip. */
.app.short{--nb:0px}
.app.fit{max-width:none;margin:0;border:0}
.viewport{position:absolute;inset:0}
.sbar{position:absolute;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:2;pointer-events:none}
#screen > *{padding-top:env(safe-area-inset-top,0px)}
#screen,#overlay{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#screen{z-index:1}
#overlay{z-index:3;background:var(--bg)}
#overlay:empty{display:none}
.g{padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.endpad{height:170px}

/* ---------- tab bar + mini player ---------- */
.nav{position:absolute;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);padding:10px 0 var(--nb);background:#0d0b0a}
.nav::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:96px;background:linear-gradient(to top,#0d0b0a,rgba(13,11,10,.85) 45%,rgba(13,11,10,0));pointer-events:none}
.nav[hidden]{display:none}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:500;color:var(--dim)}
.nav button.on{color:var(--fg)}
.nav .ic{width:25px;height:25px}
#mini{position:absolute;left:8px;right:8px;bottom:calc(var(--navh) + var(--nb) + 4px);z-index:6}
#mini:empty{display:none}
.mini{touch-action:none;position:relative;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 8px 10px;border-radius:8px;background:var(--mc,#3d2c22);cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.mini img{width:40px;height:40px;border-radius:4px;object-fit:cover;display:block}
.mini .mt{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ms{font-size:13px;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.mini .ms.dev{color:var(--gold);font-weight:600}
.mini .ms.dev .ic{width:14px;height:14px}
.mini .btns{display:flex;align-items:center;gap:14px;padding-right:6px}
.mini .btns button{display:grid;place-items:center;width:30px;height:30px}
.mini .btns button.on{color:var(--gold)}
.mini .bar{position:absolute;left:8px;right:8px;bottom:2px;height:2px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden}
.mini .bar i{display:block;height:100%;width:0;background:#fff}

/* ---------- shared bits ---------- */
.hd{display:flex;align-items:center;gap:10px;padding-top:12px;padding-bottom:12px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.h-title{font-size:23px;font-weight:800;letter-spacing:-.01em;flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{font-size:13px;font-weight:500;padding:7px 14px;border-radius:999px;background:var(--elev2);white-space:nowrap}
.chip.on{background:var(--gold);color:var(--gold-ink);font-weight:600}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;position:relative;flex:none}
.iconbtn .n{position:absolute;top:0;right:-2px;background:var(--hib);color:#1e0408;font-size:10px;font-weight:800;border-radius:999px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:26px 0 12px}
.sec h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.sec button{font-size:13px;font-weight:700;color:var(--muted)}
.shelf{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(var(--gut),env(safe-area-inset-left,0px)));padding:0 max(var(--gut),env(safe-area-inset-left,0px))}
.shelf::-webkit-scrollbar{display:none}
.tile{flex:0 0 148px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile img{width:148px;height:148px;border-radius:6px;object-fit:cover;display:block;background:var(--elev)}
.tile .tt{font-size:13.5px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .ts{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.badge{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap}
.badge.own{background:rgba(67,201,180,.18);color:var(--sea)}
.badge.inc{background:rgba(255,255,255,.12);color:#fff}
.badge.buy{background:rgba(255,79,163,.18);color:var(--gold)}
.badge.pv{background:rgba(255,93,108,.18);color:var(--hib)}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:6px 0;cursor:pointer}
.row img{width:56px;height:56px;border-radius:4px;object-fit:cover;display:block}
.row.big{grid-template-columns:64px minmax(0,1fr) auto}
.row.big img{width:64px;height:64px}
.row .rt{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rs{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:2px;white-space:nowrap;overflow:hidden}
.row .rs .ic{width:14px;height:14px;color:var(--gold)}
.more{width:36px;height:36px;display:grid;place-items:center;color:var(--muted)}
.pill{font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px;background:var(--gold);color:var(--gold-ink);white-space:nowrap}
.pill.line{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45)}
.empty{color:var(--muted);font-size:13.5px;padding:18px 0}
.banner{border-radius:10px;padding:14px;background:var(--elev2);display:flex;flex-direction:column;gap:10px;margin-top:14px;border-left:4px solid var(--gold)}
.banner.hot{border-left-color:var(--hib)}
.banner b{display:block;font-size:15px;margin-bottom:2px}
.banner span{color:var(--muted);font-size:13px}

/* Spotify-style sticky headers, tap feedback, snackbar */
.stick{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);margin-left:calc(-1 * max(var(--gut),env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(var(--gut),env(safe-area-inset-right,0px)));padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.tile,.row,.qt,.cat,.trk,.ct,.feature,.topres,.mini{transition:transform .12s ease,opacity .12s ease}
.tile:active,.row:active,.qt:active,.cat:active,.trk:active,.ct:active,.feature:active,.topres:active{transform:scale(.97);opacity:.75}
button:active{opacity:.7}
#snack{position:absolute;left:8px;right:8px;bottom:calc(var(--navh) + 80px + var(--nb));z-index:25;pointer-events:none}
.app.full #snack{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.snack{background:#fff;color:#131110;border-radius:8px;padding:12px 14px;font-size:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.45);animation:snk .2s ease-out}
.snack small{display:block;font-weight:500;color:#57514a;font-size:12.5px;margin-top:1px}
@keyframes snk{from{transform:translateY(12px);opacity:0}}
/* now-playing equaliser on the current song */
.trk.cur .tn::before{content:'';display:inline-block;width:13px;height:12px;margin-right:8px;vertical-align:-1px;background:linear-gradient(var(--gold),var(--gold)) 0 100%/3px 40% no-repeat,linear-gradient(var(--gold),var(--gold)) 5px 100%/3px 90% no-repeat,linear-gradient(var(--gold),var(--gold)) 10px 100%/3px 60% no-repeat;animation:eq .8s ease-in-out infinite alternate}
@keyframes eq{to{background-size:3px 90%,3px 35%,3px 100%}}
.app:not(.playing) .trk.cur .tn::before{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.trk.cur .tn::before,.snack{animation:none}}

.cv{position:relative;display:block;flex:none;line-height:0}
.tplay,.qplay,.tno,.tst,.thead,.mp-kind,.d-only{display:none}
.mp-hero{position:relative}
.mp-hero .mp-cover{width:70%}
.cat-t{font-size:32px;margin-top:2px}
.own-tick{position:absolute;right:6px;bottom:6px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.55)}
.own-tick .ic{width:15px;height:15px}
.row .own-tick,.qt .own-tick{width:17px;height:17px;right:3px;bottom:3px}
.row .own-tick .ic,.qt .own-tick .ic{width:11px;height:11px}
/* ---------- home ---------- */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.qt{display:grid;grid-template-columns:56px minmax(0,1fr);align-items:center;gap:10px;background:var(--elev2);border-radius:5px;overflow:hidden;height:56px;cursor:pointer}
.qt img{width:56px;height:56px;object-fit:cover;display:block}
.qt span{font-size:12.5px;font-weight:700;line-height:1.2;padding-right:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feature{margin-top:26px;border-radius:10px;overflow:hidden;background:var(--fc,#3d2c22);display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;padding:12px;align-items:center;cursor:pointer}
.feature img{width:120px;height:120px;border-radius:6px;object-fit:cover;display:block;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.feature .k{font-size:12px;color:rgba(255,255,255,.75);font-weight:600}
.feature .ft{font-size:19px;font-weight:800;line-height:1.15;margin:4px 0 10px}
.feature .fb{display:flex;align-items:center;gap:10px}
.playc{width:48px;height:48px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;flex:none;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.playc .ic{width:22px;height:22px}

/* ---------- search ---------- */
.sbox{display:flex;align-items:center;gap:10px;background:#fff;color:#131110;border-radius:6px;padding:0 12px;margin-top:4px}
.sbox .ic{width:22px;height:22px}
.sbox input{flex:1;min-width:0;font:inherit;font-size:16px;font-weight:600;color:#131110;background:transparent;border:0;padding:12px 0;outline:none}
.sbox input::placeholder{color:#57514a}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.cat{position:relative;height:100px;border-radius:7px;overflow:hidden;padding:12px;font-size:16px;font-weight:800;cursor:pointer}
.cat span{position:relative;display:block;max-width:72%;line-height:1.2}
.cat img{position:absolute;width:68px;height:68px;right:-10px;bottom:-4px;transform:rotate(25deg);border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.4)}

.topres{position:relative;display:flex;flex-direction:column;gap:10px;background:var(--elev2);border-radius:8px;padding:16px;cursor:pointer}
.topres img{width:92px;height:92px;border-radius:4px;object-fit:cover;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.topres .tt{font-size:26px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.topres .playc{position:absolute;right:16px;bottom:16px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px 14px;margin-top:20px}
.ct{cursor:pointer;min-width:0}
.ct img{width:100%;aspect-ratio:1;border-radius:6px;object-fit:cover;display:block;background:var(--elev)}
.ct .tt{font-size:14px;font-weight:600;margin-top:8px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ct .ts{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.lsort{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px}
.lsort button{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.lsort .ic{width:18px;height:18px}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 12px;margin-top:8px}
.lgrid .ct .tt{font-size:13px}
.lgrid .ct .ts{font-size:12px}

/* ---------- mix page ---------- */
.mp{position:relative;min-height:100%}
.mp-bg{position:absolute;inset:0 0 auto 0;height:520px;background:linear-gradient(to bottom,var(--pc) 0%,var(--bg) 100%);pointer-events:none}
.mp-head{position:sticky;top:0;z-index:4;height:calc(56px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center}
.mp-head .hbg{position:absolute;inset:0;background:var(--pd);opacity:var(--o,0)}
.mp-head > button,.mp-head .htitle{position:relative}
.mp-head .htitle{text-align:center;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:var(--o,0)}
.mp-head .pin{position:absolute;right:max(var(--gut),env(safe-area-inset-right,0px));top:calc(30px + env(safe-area-inset-top,0px));width:52px;height:52px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.45);opacity:0;pointer-events:none;transform:scale(.85);transition:opacity .15s,transform .15s}
.mp-head .pin .ic{width:24px;height:24px}
.mp-head.pinned .pin{opacity:1;pointer-events:auto;transform:none}
.mp-cover{position:relative;display:block;width:64%;max-width:280px;aspect-ratio:1;object-fit:cover;margin:4px auto 0;box-shadow:0 14px 40px rgba(0,0,0,.55)}
.mp-body{position:relative}
.mp-t{font-size:25px;font-weight:800;letter-spacing:-.015em;line-height:1.15;margin:22px 0 10px;text-wrap:balance}
.artist{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.artist img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.mp-meta{font-size:13px;color:var(--muted);margin-top:8px}
.mp-meta b{color:var(--fg);font-weight:600}
.acts{display:flex;align-items:center;gap:20px;margin:12px 0 6px}
.acts .sp{flex:1}
.acts .a{width:32px;height:32px;display:grid;place-items:center;color:var(--muted)}
.acts .a .ic{width:28px;height:28px}
.acts .a.on{color:var(--gold)}
.acts .play{width:54px;height:54px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center}
.acts .play .ic{width:24px;height:24px}
.note{font-size:12.5px;color:var(--muted);margin:4px 0 6px}
.trk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 0;cursor:pointer}
.trk .tn{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk .ta{font-size:13.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk.cur .tn{color:var(--gold)}
.foot{font-size:14px;margin-top:18px;font-weight:600}
.foot small{display:block;color:var(--muted);font-weight:400;font-size:13px;margin-top:4px}

/* ---------- full player ---------- */
#player{position:absolute;inset:0;z-index:20;background:var(--bg);transform:translateY(100%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s linear .32s;overflow-y:auto;overscroll-behavior:contain}
#player.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s}
@media (prefers-reduced-motion:reduce){#player{transition:none}}
.fp{position:relative;min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:40px}
.fp-bg{position:absolute;inset:0 0 auto 0;height:100%;max-height:900px;background:linear-gradient(to bottom,var(--pc) 0%,var(--pd) 55%,var(--bg) 100%);pointer-events:none}
.fp-top{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr) 40px;align-items:center;height:56px}
.fp-top .c{text-align:center;min-width:0}
.fp-top .c small{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.75);font-weight:600}
.fp-top .c b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp-cover{touch-action:pan-y;position:relative;display:block;width:100%;max-width:min(420px,calc(var(--h,800px) * .44));aspect-ratio:1;object-fit:cover;border-radius:8px;margin:14px auto 0;box-shadow:0 18px 44px rgba(0,0,0,.5)}
.fp-meta{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;margin-top:26px}
.fp-meta h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp-meta p{margin:3px 0 0;color:rgba(255,255,255,.72);font-size:15.5px}
.fp-meta button .ic{width:28px;height:28px}
.fp-meta button.on{color:var(--gold)}
.seek{--p:0%;--c:#fff;position:relative;-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:14px 0 0;cursor:pointer}
.seek::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--c) var(--p),rgba(255,255,255,.25) var(--p))}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;margin-top:-4.5px}
.seek::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.25)}
.seek::-moz-range-progress{height:4px;border-radius:2px;background:var(--c)}
.seek::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#fff}
.seek.pv{--c:var(--hib)}
.times{position:relative;display:flex;justify-content:space-between;font-size:11.5px;color:rgba(255,255,255,.7);margin-top:-4px}
.ctrls{position:relative;display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.ctrls button{display:grid;place-items:center}
.ctrls .s .ic{width:24px;height:24px}
.ctrls .s.on{color:var(--gold)}
.ctrls .pn .ic{width:36px;height:36px}
.ctrls .big{width:66px;height:66px;border-radius:50%;background:#fff;color:#131110}
.ctrls .big .ic{width:28px;height:28px}
.fp-low{position:relative;display:flex;justify-content:space-between;align-items:center;margin-top:20px;color:rgba(255,255,255,.8)}
.fp-low .r{display:flex;gap:22px}
.fp-low button .ic{width:22px;height:22px}
.fp-low .dev{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.fp-low .dev.on{color:var(--gold)}
.pvnote{position:relative;margin-top:16px;border-radius:10px;padding:12px 14px;background:rgba(255,93,108,.16);font-size:13px}
.pvnote b{color:var(--hib)}
.card{position:relative;border-radius:12px;padding:16px;margin-top:20px;background:var(--pd)}
.card h3{margin:0 0 10px;font-size:16px;font-weight:800;display:flex;justify-content:space-between;gap:10px}
.card h3 small{font-weight:500;color:rgba(255,255,255,.7);font-size:12.5px}
.card.plain{background:var(--elev)}
.about{position:relative;border-radius:12px;overflow:hidden;margin-top:16px;background:var(--elev)}
.about .ab-img{height:190px;background-size:cover;background-position:center 30%;position:relative}
.about .ab-img::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.45),rgba(0,0,0,0) 45%)}
.about .ab-img span{position:absolute;left:16px;top:14px;z-index:1;font-weight:800;font-size:16px}
.about .ab-b{padding:14px 16px 16px}
.about .ab-b b{font-size:16px}
.about .ab-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:2px;color:var(--muted);font-size:13.5px}
.about p{margin:10px 0 0;color:var(--muted);font-size:13.5px;line-height:1.45}
.qlist{position:relative;margin-top:26px}
.qlist h3{margin:0 0 8px;font-size:16px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.qlist h3 small{font-weight:500;color:rgba(255,255,255,.7);font-size:12.5px;white-space:nowrap}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;padding:8px 0;font-size:14px;align-items:center;color:rgba(255,255,255,.62);cursor:pointer}
.tl .ti b{display:block;font-size:15.5px;font-weight:500;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .ti small{display:block;font-size:13px;color:rgba(255,255,255,.65);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl li.done .ti b{color:rgba(255,255,255,.5)}
.tl li.cur .ti b{color:var(--gold);font-weight:700}
.tl .ti{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .tm{font-size:12px}
.tl li.done{color:rgba(255,255,255,.45)}
.tl li.cur{color:#fff;font-weight:700}
.tl li.cur .i{color:var(--gold)}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14.5px;padding:12px 18px;border-radius:999px;background:var(--elev2);text-align:center}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.white{background:#fff;color:#131110}
.btn.hot{background:var(--hib);color:#1e0408}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.4)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.55;cursor:default}
a.btn{text-decoration:none}
/* install guide */
.iapp{width:64px;height:64px;border-radius:15px;background:#1a1512;display:grid;place-items:center;font-family:var(--brand);color:var(--gold);font-size:22px;box-shadow:0 6px 18px rgba(0,0,0,.45);margin:4px auto 2px;border:1px solid rgba(255,79,163,.25)}
.sheet .c{text-align:center}
.istep{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:center;font-size:15px;line-height:1.45;padding:2px 0}
.istep .n{width:28px;height:28px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font-weight:800;font-size:14px}
.ichip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.13);border-radius:7px;padding:3px 8px;font-weight:700;font-size:14px;vertical-align:middle;white-space:nowrap}
.ichip .ic{width:17px;height:17px;color:#5aa9ff}
.ihint{text-align:center;font-size:12.5px}
.ilink{background:var(--elev2);border-radius:8px;padding:10px 12px;font-size:13px;word-break:break-all;-webkit-user-select:all;user-select:all}

/* ---------- account / cart ---------- */
.plan{border-radius:10px;padding:16px;background:var(--elev);display:flex;flex-direction:column;gap:8px;margin-top:12px}
.plan.cur{box-shadow:inset 0 0 0 2px var(--gold)}
.plan-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.plan-h b{font-size:17px}
.plan-p{font-size:18px;font-weight:800;white-space:nowrap}
.plan-p small{font-size:12px;color:var(--muted);font-weight:500}
.plan ul{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px}
.list-card{border-radius:10px;background:var(--elev);padding:4px 16px;margin-top:12px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
.toggle:last-child{border-bottom:0}
.toggle small{display:block;color:var(--muted);font-size:12.5px}
.toggle input{width:22px;height:22px;accent-color:var(--gold);flex:none}
.totals{display:flex;flex-direction:column;gap:6px;padding:14px 16px;background:var(--elev);border-radius:10px;margin-top:10px}
.totals div{display:flex;justify-content:space-between;gap:12px}
.totals .disc{color:var(--hib)}
.totals .grand{font-weight:800;font-size:17px;border-top:1px solid var(--line);padding-top:8px}
.why{color:var(--gold)}

/* ---------- sign in ---------- */
/* Splash: three slot-machine reels land on 6, then 5, then 1; the form rises in underneath. */
.signin{position:relative;min-height:100%;display:flex;flex-direction:column;padding-bottom:28px;overflow:hidden;cursor:default}
.sp-bg{position:absolute;inset:-25% -40%;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;transform:rotate(-14deg);opacity:0;transition:opacity 1.4s ease;pointer-events:none;animation:drift 60s linear infinite alternate}
.sp-bg img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block}
.signin.done .sp-bg{opacity:.13}
@keyframes drift{to{transform:rotate(-14deg) translateY(-14%)}}
.sp-glow{position:absolute;left:50%;top:30%;width:120%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,79,163,.16),rgba(255,79,163,0) 60%);opacity:0;transition:opacity .8s;pointer-events:none}
.signin.pop .sp-glow,.signin.done .sp-glow{opacity:1}
.sp-num{position:relative;display:flex;justify-content:center;font-family:var(--brand);font-size:min(36vw,170px);line-height:1;color:var(--gold);margin-top:auto}
.reel{display:block;height:1em;overflow:hidden;opacity:0;transition:opacity .15s,text-shadow .4s}
.reel.on{opacity:1}
.reel.set{text-shadow:0 0 34px rgba(255,79,163,.5)}
.strip{display:flex;flex-direction:column;transition:transform .7s cubic-bezier(.18,1.35,.4,1)}
.strip span{display:block;height:1em;text-align:center}
.reel.spin .strip{animation:reel .28s linear infinite;filter:blur(2px)}
@keyframes reel{from{transform:translateY(0)}to{transform:translateY(-26em)}}
.signin.pop .sp-num{animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{40%{transform:scale(1.09)}}
.sp-word{position:relative;text-align:center;font-family:var(--brand);font-size:17px;letter-spacing:.22em;padding-left:.22em;margin-top:10px;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
.sp-word i{font-style:normal;color:var(--gold)}
.sp-form{position:relative;display:flex;flex-direction:column;gap:16px;margin-top:34px;margin-bottom:auto;opacity:0;transform:translateY(26px);transition:opacity .6s .2s,transform .7s .2s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.signin.done .sp-word{opacity:1;transform:none}
.signin.done .sp-form{opacity:1;transform:none;pointer-events:auto}
.sp-skip{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;color:var(--dim);transition:opacity .4s}
.signin.done .sp-skip{opacity:0}
@media (prefers-reduced-motion:reduce){.reel.spin .strip,.sp-bg,.signin.pop .sp-num{animation:none}.strip,.sp-form,.sp-word{transition:none}}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}
.field input{font:inherit;font-size:16px;color:var(--fg);background:var(--elev2);border:1px solid var(--line);border-radius:6px;padding:13px 14px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);cursor:pointer}
.consent input{width:20px;height:20px;accent-color:var(--gold);margin-top:1px;flex:none}

/* ---------- sheet + notifications ---------- */
#sheet{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
#sheet[hidden]{display:none}
.sheet{width:100%;max-height:85%;overflow-y:auto;background:#24212a;border-radius:14px 14px 0 0;padding:10px max(var(--gut),env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(var(--gut),env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;animation:up .24s ease-out}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.3);margin:0 auto 4px}
.sheet h2{margin:0;font-size:20px;font-weight:800}
.sheet p{margin:0;color:var(--muted);font-size:14px}
.sheet .tag{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--hib);font-weight:800}
.sheet .item{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center}
.sheet .item img{width:52px;height:52px;border-radius:4px;object-fit:cover;display:block}
.opt{display:flex;align-items:center;gap:16px;padding:12px 2px;font-size:15.5px;font-weight:500;width:100%}
.opt .ic{color:var(--muted)}
.opt.on,.opt.on .ic{color:var(--gold)}
.opt small{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
#notes{position:absolute;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));z-index:40;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.notice{background:rgba(242,236,226,.97);color:#1a1320;border-radius:16px;padding:10px 14px 12px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:down .25s ease-out;font-size:14px}
.notice .from{display:flex;justify-content:space-between;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#6a5d75;margin-bottom:2px}
.notice b{display:block}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
@keyframes down{from{transform:translateY(-14px);opacity:.3}}
@media (prefers-reduced-motion:reduce){.sheet,.notice{animation:none}}

/* ================= DESKTOP: Spotify desktop layout =================
   Library sidebar on the left, main panel in the middle, Now Playing panel on the right,
   a search top bar and a full-width player bar. Kicks in at 1024px wide once signed in. */
#topbar,#side,#rpanel,#pbar,#ctx{display:none}
@media (min-width:1024px){
  .app{max-width:none;border:0}
  .signin > :not(.sp-bg):not(.sp-glow):not(.sp-skip){width:100%;max-width:440px;margin-left:auto;margin-right:auto}
}
.app.desk{--gut:24px;--lw:300px;--rw:340px;display:grid;grid-template-areas:"top top top" "side main right" "bar bar bar";grid-template-columns:var(--lw) minmax(0,1fr) var(--rw);grid-template-rows:64px minmax(0,1fr) 80px;column-gap:8px;padding:0 8px;background:#000}
@media (max-width:1279px){.app.desk{--lw:260px;--rw:290px}}
.app.desk.norp{grid-template-areas:"top top" "side main" "bar bar";grid-template-columns:var(--lw) minmax(0,1fr)}
.app.desk.sidemin{--lw:72px !important}
.desk .viewport{grid-area:main;position:relative;inset:auto;border-radius:8px;overflow:hidden;background:var(--bg)}
.desk #nav,.desk #mini,.desk .m-only,.desk .hd > .avatar,.desk .hd > .iconbtn{display:none !important}
.desk .d-only{display:block}
.desk .sec.d-only{display:flex}
.desk .mp-meta .d-only{display:inline}
.desk .endpad{height:48px}
.desk .sbar{display:none}
.desk #player{z-index:20;background:#0d0b0a}
.desk .fp{max-width:560px;margin:0 auto;padding-top:24px}
.desk #sheet{align-items:center;justify-content:center}
.desk .sheet{width:min(480px,92vw);max-height:86vh;border-radius:14px;padding:18px 22px 22px}
.desk .sheet .grab{display:none}
.desk #snack{left:50%;right:auto;transform:translateX(-50%);width:max-content;max-width:440px;bottom:96px}
.desk #notes{left:auto;right:16px;width:360px;top:72px}
.desk .tile:active,.desk .row:active,.desk .qt:active,.desk .cat:active,.desk .trk:active,.desk .ct:active,.desk .feature:active,.desk .topres:active{transform:none;opacity:1}

/* top bar */
.desk #topbar{grid-area:top;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:0 8px}
.tb-l,.tb-r{display:flex;align-items:center;gap:8px}
.tb-r{justify-content:flex-end}
.tb-c{display:flex;align-items:center;gap:8px}
.tb-round{width:48px;height:48px;border-radius:50%;background:#1e1b18;display:grid;place-items:center;color:var(--muted);flex:none}
.tb-round:hover{color:#fff;transform:scale(1.04)}
.tb-round.on{color:#fff}
.tb-arrow{width:32px;height:32px;border-radius:50%;background:#131110;display:grid;place-items:center}
.tb-arrow[disabled]{opacity:.4;cursor:not-allowed}
.tb-arrow .ic{width:18px;height:18px}
.tb-search{display:flex;align-items:center;gap:10px;width:min(480px,36vw);height:48px;border-radius:999px;background:#1e1b18;padding:0 8px 0 14px;color:var(--muted);cursor:text}
.tb-search:hover{background:#2a2621}
.tb-search:focus-within{box-shadow:0 0 0 2px #fff;color:#fff}
.tb-search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font:inherit;font-size:15px}
.tb-search input::placeholder{color:var(--muted)}
.tb-search kbd{font:inherit;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.tb-browse{border-left:1px solid var(--line);padding-left:10px;height:28px;display:grid;place-items:center;color:var(--muted)}
.tb-browse:hover{color:#fff}
.tb-pill{background:#fff;color:#131110;font-weight:800;font-size:13px;padding:8px 16px;border-radius:999px;white-space:nowrap}
.tb-pill:hover{transform:scale(1.04)}
.tb-pill.dark{background:transparent;color:var(--muted);border:0;display:flex;align-items:center;gap:6px}
.tb-pill.dark:hover{color:#fff}
.tb-r .iconbtn{background:#131110}
.tb-r .avatar{border:6px solid #131110;width:44px;height:44px;box-sizing:content-box;margin:-6px}

/* library sidebar */
.desk #side{grid-area:side;display:flex;flex-direction:column;background:var(--bg);border-radius:8px;min-height:0;position:relative}
.sd-head{display:flex;align-items:center;gap:8px;padding:14px 12px 6px 16px}
.sd-title{display:flex;align-items:center;gap:12px;font-weight:800;font-size:16px;color:var(--muted)}
.sd-title:hover{color:#fff}
.sd-ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.sd-ic:hover{color:#fff;background:#ffffff14}
.sd-ic .ic{width:20px;height:20px}
.sd-chips{padding:6px 16px 4px}
.sd-tools{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px 4px 16px;color:var(--muted);font-size:13px}
.sd-tools button{display:flex;align-items:center;gap:6px;color:var(--muted)}
.sd-tools button:hover{color:#fff}
.sd-tools .ic{width:16px;height:16px}
.sd-find{display:flex;align-items:center;gap:6px;background:#2a2621;border-radius:6px;padding:0 8px;height:32px;flex:1;max-width:180px}
.sd-find input{background:transparent;border:0;outline:0;color:#fff;font:inherit;font-size:13px;width:100%}
.sd-list{flex:1;overflow-y:auto;padding:4px 8px 12px;min-height:0}
.sd-row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer}
.sd-row:hover{background:#ffffff12}
.sd-row.on{background:#ffffff1f}
.sd-row img{width:48px;height:48px;border-radius:4px;object-fit:cover;display:block}
.sd-row .rt{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sd-row .rt.now{color:var(--gold)}
.sd-row .rs{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;margin-top:2px}
.sd-row .rs .ic{width:13px;height:13px;color:var(--gold)}
.sd-row .eqi{color:var(--gold)}
.sd-row .eqi .ic{width:16px;height:16px}
.sd-row .own-tick{width:17px;height:17px;right:3px;bottom:3px}
.sd-row .own-tick .ic{width:11px;height:11px}
.sd-empty{margin:8px;padding:18px;border-radius:8px;background:var(--elev2)}
.sd-empty b{display:block;font-size:16px;margin-bottom:6px}
.sd-empty p{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.sd-resize{position:absolute;top:0;bottom:0;right:-8px;width:8px;cursor:col-resize;z-index:3}
.sd-resize:hover,.sd-resize.drag{background:linear-gradient(90deg,transparent 3px,#ffffff40 3px,#ffffff40 5px,transparent 5px)}
.sidemin .sd-title b,.sidemin .sd-head .sd-ic,.sidemin .sd-chips,.sidemin .sd-tools,.sidemin .sd-row > div,.sidemin .sd-row > .eqi,.sidemin .sd-empty{display:none}
.sidemin .sd-head{justify-content:center;padding:16px 0 8px}
.sidemin .sd-row{grid-template-columns:48px;justify-content:center}

/* now playing panel */
.desk #rpanel{grid-area:right;display:block;background:var(--bg);border-radius:8px;overflow-y:auto;min-height:0}
.desk.norp #rpanel{display:none}
.rp{position:relative;padding:0 16px 24px}
.rp-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 0 12px;background:var(--bg)}
.rp-head b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.rp-head b:hover{text-decoration:underline}
.rp-cover{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;box-shadow:0 10px 30px rgba(0,0,0,.45);cursor:pointer}
.rp-meta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;margin-top:16px}
.rp-meta h2{margin:0;font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-meta p{margin:4px 0 0;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-meta button{color:var(--muted)} .rp-meta button.on{color:var(--gold)}
.rp .card,.rp .about{margin-top:16px}
.rp .pvnote{margin-top:14px}
.rp-next h3 button{font-size:12.5px;font-weight:700;color:var(--muted)}
.rp-next h3 button:hover{color:#fff;text-decoration:underline}

/* player bar */
.desk #pbar{grid-area:bar;display:grid;grid-template-columns:minmax(180px,30%) minmax(0,40%) minmax(180px,30%);align-items:center;padding:0 8px}
.pb-l{display:flex;align-items:center;gap:12px;min-width:0}
.pb-l img{width:56px;height:56px;border-radius:4px;object-fit:cover;cursor:pointer;flex:none}
.pb-l .tx{min-width:0}
.pb-t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;display:flex;align-items:center;gap:6px}
.pb-t span{overflow:hidden;text-overflow:ellipsis}
.pb-t:hover span{text-decoration:underline}
.pb-s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.pb-l .add{color:var(--muted);flex:none;display:grid;place-items:center}
.pb-l .add .ic{width:18px;height:18px}
.pb-l .add.on{color:var(--gold)}
.pb-c{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;max-width:722px;justify-self:center}
.pb-ctrls{display:flex;align-items:center;gap:20px}
.pb-ctrls button{color:var(--muted);display:grid;place-items:center}
.pb-ctrls button:hover{color:#fff}
.pb-ctrls .on{color:var(--gold)}
.pb-ctrls .ic{width:18px;height:18px}
.pb-ctrls .pp{width:34px;height:34px;border-radius:50%;background:#fff;color:#131110}
.pb-ctrls .pp:hover{color:#131110;transform:scale(1.06)}
.pb-prog{display:flex;align-items:center;gap:8px;width:100%;font-size:11.5px;color:var(--muted)}
.pb-prog span{min-width:40px;text-align:center}
.pb-prog .seek,.pb-r .seek{margin:0;height:14px;flex:1}
.pb-prog .seek:hover,.pb-r .seek:hover{--c:var(--gold)}
.pb-r{display:flex;align-items:center;justify-content:flex-end;gap:14px;color:var(--muted)}
.pb-r button{display:grid;place-items:center;color:var(--muted)}
.pb-r button:hover{color:#fff}
.pb-r .on{color:var(--gold)}
.pb-r .ic{width:18px;height:18px}
.pb-r .vol{flex:0 0 92px}

/* main panel content, desktop sizes */
.desk .shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));grid-template-rows:auto;grid-auto-rows:0;row-gap:0;column-gap:0;overflow:hidden;margin:0 -12px;padding:0}
.desk .tile{padding:12px;border-radius:8px;gap:6px;position:relative}
.desk .tile:hover,.desk .ct:hover{background:#ffffff12}
.desk .tile img{width:100%;height:auto;aspect-ratio:1;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.desk .tile .tt{font-size:15px}
.desk .tplay{display:grid;place-items:center;position:absolute;right:8px;bottom:8px;width:48px;height:48px;border-radius:50%;background:var(--gold);color:var(--gold-ink);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;box-shadow:0 8px 16px rgba(0,0,0,.4)}
.desk .tplay:hover{transform:scale(1.05)}
.desk .tile:hover .tplay,.desk .ct:hover .tplay{opacity:1;transform:none}
.desk .tile:hover .own-tick,.desk .ct:hover .own-tick{opacity:0}
.desk .quick{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.desk .qt{height:64px;grid-template-columns:64px minmax(0,1fr) auto;background:#ffffff14;position:relative}
.desk .qt:hover{background:#ffffff24}
.desk .qt img{width:64px;height:64px}
.desk .qt span{font-size:14px}
.desk .qplay{display:grid;place-items:center;width:36px;height:36px;margin-right:10px;border-radius:50%;background:var(--gold);color:var(--gold-ink);opacity:0;transition:opacity .2s}
.desk .qplay .ic{width:18px;height:18px}
.desk .qt:hover .qplay{opacity:1}
.desk .feature{max-width:760px}
.desk .cats{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}
.desk .cat{height:auto;aspect-ratio:1.6;font-size:22px;padding:16px}
.desk .cat img{width:100px;height:100px;right:-14px;bottom:-6px}
.desk .cgrid,.desk .lgrid{grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:0;margin:18px -12px 0}
.desk .ct{padding:12px;border-radius:8px}
.desk .topres{max-width:460px}
.desk .row:hover{background:#ffffff0d;border-radius:6px}
.desk .h-title{font-size:28px}

/* mix + category pages */
.desk .mp-head{height:64px;padding-top:0;grid-template-columns:80px minmax(0,1fr) 44px}
.desk .mp-head > button[data-act=back]{visibility:hidden}
.desk .mp-head .htitle{text-align:left;font-size:22px;font-weight:800}
.desk .mp-head .pin{top:8px;left:var(--gut);right:auto;width:48px;height:48px}
.desk .mp-hero{display:flex;align-items:flex-end;gap:24px;padding-top:8px;padding-bottom:20px}
.desk .mp-cover{width:232px;height:232px;margin:0;border-radius:6px;flex:none;max-width:none}
.desk .mp-info{min-width:0}
.desk .mp-kind{display:block;font-size:14px;font-weight:600}
.desk .mp-t{font-size:clamp(36px,5.2vw,84px);line-height:1;letter-spacing:-.035em;margin:8px 0 14px}
.desk .cat-t{font-size:clamp(40px,6vw,88px);margin:28px 0 12px}
.desk .mp-sub{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.desk .mp-sub .mp-meta{margin:0}
.desk .mp-sub .mp-meta::before{content:'• ';color:var(--muted)}
.desk .acts{gap:24px;margin:16px 0 10px}
.desk .acts .play{order:-1;width:56px;height:56px}
.desk .acts .sp{display:none}
.desk .thead,.desk .trk{display:grid;grid-template-columns:32px minmax(0,1fr) 90px 40px;gap:16px;align-items:center;padding:6px 16px;margin:0 -16px;border-radius:6px}
.desk .thead{color:var(--muted);font-size:13px;border-bottom:1px solid var(--line);border-radius:0;margin-bottom:10px;padding-bottom:8px;position:sticky;top:64px;background:var(--bg);z-index:3}
.desk .trk:hover{background:#ffffff14}
.desk .tno,.desk .tst{display:block;color:var(--muted);font-size:15px;text-align:center}
.desk .tst{text-align:right;font-size:14px}
.desk .thead .tst{font-size:13px}
.desk .tno .ic{display:none;width:14px;height:14px;margin:0 auto;color:#fff}
.desk .trk:hover .tno i{display:none}
.desk .trk:hover .tno .ic{display:block}
.desk .tno i{font-style:normal}
.desk .trk.cur .tno i{color:var(--gold)}
.desk .trk .more{opacity:0}
.desk .trk:hover .more{opacity:1}

/* right-click menu */
#ctx{position:fixed;z-index:60;min-width:220px;max-width:280px;background:#2a2621;border-radius:6px;padding:4px;box-shadow:0 16px 40px rgba(0,0,0,.6)}
#ctx.on{display:block}
#ctx button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:4px;font-size:14px;color:#eae6ee}
#ctx button:hover{background:#ffffff1a}
#ctx .ic{width:18px;height:18px;color:var(--muted)}
#ctx hr{border:0;border-top:1px solid #ffffff1a;margin:4px 0}

/* QR + shortcuts */
.qr{background:#fff;padding:12px;border-radius:12px;width:192px;height:192px;margin:4px auto;display:grid;place-items:center}
.qr img,.qr canvas{display:block}
.kb{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:14px 16px;font-size:14px}
.kb kbd{font:inherit;font-size:12px;background:var(--elev2);border:1px solid var(--line);border-radius:4px;padding:2px 7px;color:#fff;white-space:nowrap}
.desk .list-card.kb{display:grid}
.mp-t,.fp-meta h1,.ft{letter-spacing:-.02em}
.sp-num{font-weight:900}

/* ================= VINYL touches ================= */
@keyframes kkspin{to{transform:rotate(360deg)}}
.kkrec,.kkmprec{display:none}
.vinyl-groove{background:radial-gradient(circle,#ff4fa3 0 9%,#131110 9.5% 11%,transparent 11.5%),repeating-radial-gradient(circle,#0c0a09 0 2px,#1c1916 2px 3.5px)}
/* records sliding out of the shelf covers */
.tile{margin-right:40px}
.tile .cv{overflow:visible}
.tile .cv img{position:relative;z-index:2}
.tile .kkrec{display:block;position:absolute;z-index:1;top:5%;left:40%;width:90%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,#ff4fa3 0 9%,#131110 9.5% 11%,transparent 11.5%),repeating-radial-gradient(circle,#0c0a09 0 2px,#1c1916 2px 3.5px);
  box-shadow:0 6px 14px rgba(0,0,0,.5);transition:left .25s ease}
.tile:hover .kkrec{left:52%}
.tile .tplay{z-index:3}
/* the mix page: record behind the big cover, warm sunset background */
.mp-hero .mp-cover{position:relative;z-index:2}
.app:not(.desk) .kkmprec{display:block;position:absolute;z-index:1;width:56%;max-width:250px;aspect-ratio:1;border-radius:50%;left:38%;top:calc(env(safe-area-inset-top,0px) + 60px);
  background:radial-gradient(circle,#ff4fa3 0 10%,#131110 10.5% 12%,transparent 12.5%),repeating-radial-gradient(circle,#0c0a09 0 2px,#1c1916 2px 3.5px);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.desk .mp-hero{position:relative}
.desk .kkmprec{display:block;position:absolute;z-index:1;width:220px;height:220px;border-radius:50%;left:calc(var(--gut,16px) + 108px);bottom:26px;
  background:radial-gradient(circle,#ff4fa3 0 10%,#131110 10.5% 12%,transparent 12.5%),repeating-radial-gradient(circle,#0c0a09 0 2px,#1c1916 2px 3.5px);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.desk .mp-hero > :not(.kkmprec):not(.mp-cover){position:relative;z-index:2;margin-left:70px}
.mp-bg{background:linear-gradient(to bottom,#7a2a10 0%,#3a1a10 45%,var(--bg) 100%)!important}
/* the playing cover is a record that spins while music plays */
.mini img,.pb-l img{border-radius:50%!important;box-shadow:0 0 0 3px #0c0a09,0 0 0 4px rgba(255,255,255,.15);animation:kkspin 4s linear infinite;animation-play-state:paused}
.fp-cover{border-radius:50%!important;width:72%!important;margin-top:24px!important;box-shadow:0 0 0 18px #0c0a09,0 0 0 19px rgba(255,255,255,.12),0 20px 40px rgba(0,0,0,.6)!important;animation:kkspin 9s linear infinite;animation-play-state:paused}
.rp-cover{border-radius:50%!important;box-shadow:0 0 0 14px #0c0a09,0 0 0 15px rgba(255,255,255,.12),0 16px 34px rgba(0,0,0,.55)!important;width:calc(100% - 30px)!important;margin:15px auto;animation:kkspin 9s linear infinite;animation-play-state:paused}
.app.playing .mini img,.app.playing .pb-l img,.app.playing .fp-cover,.app.playing .rp-cover{animation-play-state:running}
/* Search: record crates instead of Spotify-style category boxes */
.cats{gap:16px 12px}
.cat.crate{height:140px;padding:0;overflow:visible;background:none!important;border-radius:0}
.cat.crate .crate-rec{position:absolute;display:block;max-width:none;left:50%;top:0;width:100px;height:100px;margin-left:-50px;border-radius:50%;z-index:1;
  background:conic-gradient(from 20deg,transparent 0 12%,rgba(255,235,210,.22) 18%,transparent 26% 62%,rgba(255,235,210,.16) 68%,transparent 75%),repeating-radial-gradient(circle,#161311 0 2px,#3a332d 2px 3.2px);
  box-shadow:0 0 0 1.5px rgba(242,236,226,.22),0 6px 16px rgba(0,0,0,.55);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.cat.crate .crate-rec img{position:absolute;left:50%;top:50%;width:44%;height:44%;margin:-22% 0 0 -22%;border-radius:50%;transform:none;right:auto;bottom:auto;box-shadow:0 0 0 2px #0c0a09;object-fit:cover}
.cat.crate .crate-rec::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#0c0a09;z-index:2}
.cat.crate .crate-sleeve{position:absolute;display:flex;flex-direction:column;justify-content:flex-end;max-width:none;left:0;right:0;bottom:0;height:92px;z-index:2;border-radius:10px;
  padding:10px 12px;background:var(--cc);box-shadow:inset 0 7px 0 rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.3)}
.cat.crate .crate-sleeve b{font-size:16px;font-weight:800;line-height:1.15;color:#fff}
.cat.crate .crate-sleeve small{font-size:11.5px;font-weight:600;color:rgba(255,255,255,.82);margin-top:2px}
.cat.crate:hover .crate-rec,.cat.crate:active .crate-rec{transform:translateY(-8px) rotate(50deg)}
.desk .cat.crate{height:190px;aspect-ratio:auto;padding:0}
.desk .cat.crate .crate-rec{width:140px;height:140px;margin-left:-70px}
.desk .cat.crate .crate-sleeve{height:124px;padding:14px 16px}
.desk .cat.crate .crate-sleeve b{font-size:20px}
.desk .cat.crate .crate-sleeve small{font-size:13px}
/* play buttons with grooves, song times as needle-drop tags */
.playc,.acts .play,.mp-body .play,.pb-ctrls .pp{background:radial-gradient(circle,#ff4fa3 0 55%,#d6337f 56% 60%,#ff4fa3 61%)!important;color:#16130F!important}
.trk .tst{background:rgba(255,79,163,.14);color:#ff86c0!important;padding:3px 8px;border-radius:20px;font-weight:700;justify-self:end}
.trk .tst::before{content:"▸ "}
.thead .tst{background:none!important;padding:0!important}.thead .tst::before{content:none}
</style>

</head>
<body>
<div class="app" id="app">
  <header id="topbar"></header>
  <aside id="side" aria-label="Your Library"></aside>
  <aside id="rpanel" aria-label="Now playing"></aside>
  <footer id="pbar" aria-label="Player"></footer>
  <div id="ctx" role="menu"></div>
  <div class="viewport">
    <div id="screen"></div>
    <div class="sbar"></div>
    <div id="overlay"></div>
  </div>
  <div id="mini"></div>
  <nav class="nav" id="nav" aria-label="App sections" hidden></nav>
  <div id="player" aria-label="Now playing"></div>
  <div id="sheet" hidden></div>
  <div id="notes" aria-live="polite"></div>
  <div id="snack" aria-live="polite"></div>
</div>

let splashDone = false, splashT = [];
function runSplash(){
  const root = $('signin');
  if (!root || splashDone || root.dataset.run) return;
  root.dataset.run = '1';
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { finishSplash(); return; }
  const k = innerWidth >= 1024 ? 0.65 : 1, reels = [...root.querySelectorAll('.reel')], at = (ms, fn) => splashT.push(setTimeout(fn, ms * k));
  let t = 250;
  reels.forEach((r, i) => {
    at(t, () => r.classList.add('on', 'spin'));
    t += i === 0 ? 1100 : 800;   // fast count
    at(t, () => land(r));
    t += i === reels.length - 1 ? 500 : 1100;   // pause on the letter
  });
  at(t, () => root.classList.add('pop'));
  at(t + 550, finishSplash);
}
function land(r){
  const s = r.firstElementChild, y = new DOMMatrix(getComputedStyle(s).transform).m42;
  r.classList.remove('spin');
  s.style.transition = 'none'; s.style.transform = `translateY(${y}px)`; s.offsetHeight;
  s.style.transition = ''; s.style.transform = `translateY(-${26 + +r.dataset.d}em)`;
  r.classList.add('set');
}
function finishSplash(){
  splashT.forEach(clearTimeout); splashT = []; splashDone = true;
  const root = $('signin'); if (!root) return;
  root.querySelectorAll('.reel').forEach(r => { if (!r.classList.contains('set')) land(r); r.classList.add('on'); });
  root.classList.add('done');
  maybeInstall();
}

function checkSpend(){
  if (S.fired.spend || member() || S.spent < 38) return;
  S.fired.spend = true;
  notify('Demo DJ', 'New offer', `You've spent $${S.spent} on mixes. For $29 a month you'd stream all ${vis().length}.`, 2500);
}
function suggestions(){
  const taken = id => owns(id) || inCart(id) || !vis().some(m => m.id === id);
  const out = [], seen = new Set();
  const push = (id, why) => { if (!taken(id) && !seen.has(id)) { seen.add(id); out.push({m:byId[id], why}); } };
  [...S.cart.map(c => c.id), ...S.owned].forEach(a => { const s = byId[a].series; if (s) vis().filter(m => m.series === s).forEach(m => push(m.id, `Same series as ${byId[a].t}`)); });
  S.recent.forEach(id => push(id, `You've played it ${S.plays[id]} time${S.plays[id]>1?'s':''}`));
  vis().forEach(m => push(m.id, 'Popular with fans like you'));
  return out.slice(0, 3);
}
function cartTotals(){
  const sub = S.cart.reduce((a, c) => a + itemPrice(c), 0);
  const std = S.cart.filter(c => c.special == null).length, bundle = member() ? 30 : 45;
  const disc = S.offerB2B ? Math.floor(std/3) * (unitPrice()*3 - bundle) : 0;
  return {sub, disc, total: sub - disc, std, bundle};
}
function bought(ids, total){
  ids.forEach(id => { S.owned.add(id); S.saved.delete(id); });
  S.spent += total;
  if (S.preview && owns(S.now)) S.preview = false;
  checkSpend();
}

/* ---------- events ---------- */
document.addEventListener('input', e => {
  if (e.target.id === 'seek' || e.target.id === 'pbseek') { seekTo(e.target.value / 10); updateProgress(); updatePosition(true); }
  if (e.target.id === 'vol') { setVol(+e.target.value, true); }
  if (e.target.id === 'dq') { S.q = e.target.value; S.tab = 'search'; S.stack = []; S.full = false; render(); }
  if (e.target.id === 'sdq') { const q = e.target.value.trim().toLowerCase(); document.querySelectorAll('#sdlist .sd-row').forEach(r => { r.style.display = !q || r.title.toLowerCase().includes(q) ? '' : 'none'; }); }
  if (e.target.id === 'q') { S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $('q'); if (q) { q.focus(); q.setSelectionRange(pos, pos); } }
});
document.addEventListener('change', e => {
  if (e.target.id === 'smsopt') S.sms = e.target.checked;
  if (e.target.dataset.pref === 'sms') { S.sms = e.target.checked; toast(S.sms ? 'Texts on' : 'Texts off', S.sms ? 'You’ll get offers and new mix alerts by text.' : 'You’ll get them as notifications instead.'); }
});
document.addEventListener('click', e => {
  if (swiped) { swiped = false; e.preventDefault(); return; }
  if (e.target.id === 'sheet') { closeSheet(); return; }
  if (!splashDone && e.target.closest('#signin')) { finishSplash(); return; }
  hideCtx();
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (['open','openfrom','cat','cart','tab'].includes(a)) S.fwd = [];
  switch (a){
    case 'noop': return;
    case 'signin': S.signedIn = true; S.full = false; S.tab = 'home'; break;
    case 'signout': splashDone = false; S.signedIn = false; S.playing = false; S.stack = []; S.full = false; closeSheet(); break;
    case 'tab': S.tab = b.dataset.tab; S.stack = []; closeSheet(); render(); $('screen').scrollTop = 0; return;
    case 'hfilter': S.homeFilter = b.dataset.f; break;
    case 'lfilter': S.libFilter = b.dataset.f; break;
    case 'lsort': { const o = ['recent','az','date']; S.libSort = o[(o.indexOf(S.libSort) + 1) % o.length]; break; }
    case 'lview': S.libGrid = !S.libGrid; break;
    case 'qfilter': S.qf = b.dataset.f; break;
    case 'follow': S.follow = !S.follow; toast(S.follow ? 'You’re following Demo DJ' : 'Unfollowed Demo DJ', S.follow ? 'You’ll hear about new mixes first.' : ''); break;
    case 'open': openMix(id); S.full = false; closeSheet(); break;
    case 'openfrom': S.full = false; openMix(id); break;
    case 'cat': S.stack.push({type:'cat', id}); break;
    case 'cart': S.stack.push({type:'cart'}); S.full = false; closeSheet(); break;
    case 'back': { const pg = S.stack.pop(); if (pg) S.fwd.push(pg); break; }
    case 'fwd': { const pg = S.fwd.pop(); if (pg) S.stack.push(pg); break; }
    case 'rptoggle': S.rp = !S.rp; break;
    case 'sidemin': S.sideMin = !S.sideMin; break;
    case 'mute': setVol(S.vol === 0 ? (S.lastVol || 80) : 0); return;
    case 'fullscreen': S.full = true; render(); try { if (document.documentElement.requestFullscreen && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); } catch (err) {} return;
    case 'expand': S.full = true; break;
    case 'collapse': collapse(); return;
    case 'shop': closeSheet(); S.stack = []; S.full = false; S.tab = 'home'; S.homeFilter = 'new'; render(); $('screen').scrollTop = 0; return;
    case 'play':
      if (id === S.now && S.last === id && !S.playing && S.progress < 100) { S.playing = true; break; }
      play(id); return;
    case 'playat': {
      const n = tracks(id).length, i = +b.dataset.i;
      play(id, {at: n ? startOf(id, i) / toSecs(byId[id].len) * 100 + 0.001 : 0}); return; }
    case 'seekto': {
      if (S.preview) return;
      seekTo(startOf(S.now, +b.dataset.i) / dur() * 100 + 0.001); S.curTrack = -2; updateProgress(); return; }
    case 'toggle': togglePlay(); return;
    case 'next': { const l = upNext(); play(S.shuffle ? l[Math.floor(Math.random()*l.length)].id : l[0].id); return; }
    case 'prev': {
      if (dur() * S.progress / 100 > 5) { seekTo(0); updateProgress(); return; }
      const list = vis(), i = list.findIndex(x => x.id === S.now); play(list[(i - 1 + list.length) % list.length].id); return; }
    case 'shuffle': S.shuffle = !S.shuffle; break;
    case 'repeat': S.repeat = !S.repeat; break;
    case 'devices': devicesSheet(); return;
    case 'device': S.device = id; closeSheet(); toast(id === 'phone' ? 'Playing on this phone' : `Connected to ${DEVICES.find(d => d.id === id).name}`); break;
    case 'queue': queueSheet(); return;
    case 'queueadd': playNext = id; closeSheet(); toast('Playing next', byId[id].t); break;
    case 'share': closeSheet(); toast('Link copied', 'Send it to a friend. Demo only.'); return;
    case 'mixmore':
      if (isDesk() && S.signedIn) { const r = b.getBoundingClientRect(); openCtx(id, r.left, r.bottom + 4); return; }
      moreSheet(id); return;
    case 'buynow': buyNow(id); return;
    case 'buyspecial': buyNow(id, member() ? 10 : 15); return;
    case 'pay': {
      const price = +b.dataset.price; closeSheet();
      S.cart = S.cart.filter(c => c.id !== id);
      bought([id], price);
      toast(`It's yours: ${byId[id].t}`, 'Added to Your Library. Download it any time.'); break; }
    case 'addcart':
      closeSheet();
      if (inCart(id)) { S.cart = S.cart.filter(c => c.id !== id); toast('Removed from cart'); }
      else if (!owns(id)) { S.cart.push({id}); toast('Added to cart', `${byId[id].t} · $${unitPrice()}`); }
      break;
    case 'remove': S.cart = S.cart.filter(c => c.id !== id); break;
    case 'checkout': {
      const t = cartTotals(), ids = S.cart.map(c => c.id);
      S.cart = []; S.stack = []; S.tab = 'library'; S.libFilter = 'all'; bought(ids, t.total);
      toast(`Paid $${t.total}`, `${ids.length} mix${ids.length>1?'es':''} added to Your Library.`); break; }
    case 'save':
      closeSheet();
      if (S.saved.has(id)) { S.saved.delete(id); S.offline.delete(id); toast('Removed from Your Library'); }
      else { S.saved.add(id); toast('Added to Your Library', byId[id].t); }
      break;
    case 'offline':
      if (S.offline.has(id)) { S.offline.delete(id); toast('Removed from downloads'); }
      else { S.offline.add(id); S.saved.add(id); toast('Downloaded', 'Plays without signal while you’re on Listen.'); }
      break;
    case 'download': closeSheet(); toast('Downloading MP3', `${byId[id].t}. Demo only.`); return;
    case 'plan': {
      const p = b.dataset.plan; if (p === S.plan) break;
      S.billing = 'ok'; S.lapsed = false;
      closeSheet(); S.plan = p;
      if (canPlay(S.now)) S.preview = false;
      else if (!S.preview) { S.preview = true; S.playing = false; S.progress = 0; }
      toast(p === 'none' ? 'Listen cancelled' : 'Welcome to Listen', p === 'none' ? 'You keep every mix you bought.' : 'Every mix is unlocked. Demo only, nothing charged.'); break; }
    case 'closesheet': closeSheet(); return;
    case 'payfail': {
      const started = !member();
      if (started) { S.plan = 'listen'; S.preview = false; }
      S.billing = 'failed';
      text(`Your Listen payment didn't go through. Update your card by ${graceEnds()} to keep streaming.`, 400);
      notify('Mail · Demo DJ', 'Your payment didn\'t go through', `Nothing changes yet. Update your card in the next ${GRACE_DAYS} days and you keep every mix.`, 2600);
      toast(started ? 'Listen started, then the next payment failed' : 'Payment failed', `Listen keeps working for ${GRACE_DAYS} days while the card is retried.`);
      S.tab = 'home'; S.stack = []; render(); $('screen').scrollTop = 0; return; }
    case 'updatecard':
      openSheet(`<h2>Update your card</h2><p>Your card ending 4242 was declined. Add a new one and Listen carries on.</p>
        <div class="item"><span class="iapp" style="width:52px;height:52px;font-size:15px;margin:0">ND</span><div style="min-width:0"><b>Listen</b><div style="color:var(--muted);font-size:13px">$29 a month · next charge today</div></div><b class="tab">$29</b></div>
        <button class="btn gold wide" data-act="cardfixed">Pay $29 with a new card</button>
        <p style="text-align:center;font-size:12.5px">Apple Pay, Google Pay or card. Demo only, nothing is charged.</p>
        <button class="btn ghost wide" data-act="closesheet">Not now</button>`); return;
    case 'cardfixed': closeSheet(); S.billing = 'ok'; toast('Card updated', 'Listen carries on. Thanks!'); break;
    case 'graceend': {
      text(`Reminder: your Listen payment still hasn't gone through. Update your card to keep streaming.`, 300);
      toast('Day 7', 'A reminder goes out. Still no new card.');
      setTimeout(() => {
        if (S.billing !== 'failed') return;
        S.billing = 'ok'; S.lapsed = true; S.plan = 'none';
        if (!canPlay(S.now)) { S.preview = true; S.playing = false; S.progress = 0; }
        notify('Demo DJ', 'Listen has ended', `Your bought mixes still play and download. Everything else is back to ${PV} previews.`, 0);
        toast('Day 14', 'Listen ended. Bought mixes still play; downloads from Listen are locked.');
        render();
        setTimeout(() => { if (S.lapsed && $('sheet').hidden) offer('Welcome back offer', 'Come back to Listen for $15', 'Your first month back is $15 instead of $29. Everything in your Library unlocks again straight away.',
          [{act:'winback', label:'Come back for $15'}, {act:'closesheet', label:'Not now'}]); }, 4500);
      }, 2600);
      return; }
    case 'winback':
      closeSheet(); S.plan = 'listen'; S.lapsed = false; S.billing = 'ok';
      if (canPlay(S.now)) S.preview = false;
      toast('Welcome back to Listen', 'First month $15. Your Library is unlocked. Demo only, nothing charged.'); break;
    case 'install': installSheet(); return;
    case 'installnow':
      if (installEvt) { const ev = installEvt; installEvt = null; ev.prompt(); ev.userChoice.then(c => { if (c.outcome === 'accepted') markInstalled(); }); }
      closeSheet(); return;
    case 'installdone': markInstalled(); closeSheet(); toast('Nice one', 'Open Demo DJ from your Home Screen from now on.'); break;
    case 'installlater': closeSheet(); return;
    case 'installhide': nudgeHidden = true; break;
    case 'copylink': copyLink(); return;
    case 'quiet': {
      S.playing = false; S.streak = 0; S.last = null;
      const sug = suggestions().map(s => s.m.t);
      if (S.cart.length) notify('Mail · Demo DJ', 'Your cart is still here', `${S.cart.map(c => byId[c.id].t).join(', ')}. Finish your order this week for 10% off.`, 400);
      else if (member()) notify('Mail · Demo DJ', 'We miss you', `You're still on Listen. ${sug[0] || 'A new mix'} is waiting for you.`, 400);
      else notify('Mail · Demo DJ', '3 mixes picked for you', `Based on what you own: ${sug.join(', ')}.`, 400);
      toast('14 days later', 'You haven’t played anything, so Demo DJ sends a nudge.');
      break; }
    case 'drop': {
      S.released = true;
      const similar = ['late-night-drive-1','sunday-slow-jams-4','throwback-thursday-3'].filter(x => S.plays[x]);
      if (similar.length) notify('Demo DJ', 'New from Demo DJ', `Late Night Drive Vol 2 just dropped: an hour of R&B for the drive home. You played ${byId[similar[0]].t}, so this one’s for you.`, 300);
      else notify('Mail · Demo DJ', 'This week on the shelf', 'Late Night Drive Vol 2: an hour of R&B for the drive home.', 300);
      S.tab = 'home'; S.homeFilter = 'all'; S.stack = []; render(); $('screen').scrollTop = 0; return; }
    case 'reset': splashDone = false; clearInterval(timer); timer = null; playNext = null; closeSheet(); S = fresh(); audioId = null; audio.pause(); break;
    case 'pvend': {
      if (!S.preview) { toast('Play a mix you don’t own first', `Then this jumps to the end of its ${PV} preview.`); return; }
      seekTo((dur() - 8) / dur() * 100); S.playing = true; if (!timer) timer = setInterval(tick, 250); S.tab = S.tab; render(); return; }
  }
  render();
});

function collapse(){
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
  if (isDesk()) { S.full = false; render(); return; }
  S.full = false;
  const t = topPage();
  if (!t || t.type !== 'mix' || t.id !== S.now) openMix(S.now);
  render();
  requestAnimationFrame(() => {
    const ov = $('overlay'), cur = ov.querySelector('.trk.cur');
    if (cur) ov.scrollTop = Math.max(0, ov.scrollTop + cur.getBoundingClientRect().top - ov.getBoundingClientRect().top - ov.clientHeight * 0.35);
    onScroll();
  });
}
const skip = dir => {
  if (dir > 0) { const l = upNext(); play(S.shuffle ? l[Math.floor(Math.random()*l.length)].id : l[0].id); }
  else { const list = vis(), i = list.findIndex(x => x.id === S.now); play(list[(i - 1 + list.length) % list.length].id); }
};

/* Swipes, like Spotify: mini player left/right skips and up opens the player;
   the player's cover skips left/right; pulling the player down from the top closes it. */
let drag = null, swiped = false;
function dragStart(x, y, target){
  const zone = target.closest('.mini') ? 'mini' : target.closest('.fp-cover') ? 'cover' : target.closest('#player') ? 'player' : null;
  if (!zone || target.closest('input')) { drag = null; return; }
  drag = {x, y, zone, top: $('player').scrollTop <= 0, dx: 0, dy: 0};
}
function dragMove(x, y){
  if (!drag) return;
  drag.dx = x - drag.x; drag.dy = y - drag.y;
  if (drag.zone !== 'mini' && drag.top && drag.dy > 0 && drag.dy > Math.abs(drag.dx)) {
    const pl = $('player'); pl.style.transition = 'none'; pl.style.transform = `translateY(${drag.dy}px)`;
  }
}
function dragEnd(){
  if (!drag) return;
  const {dx, dy, zone, top} = drag; drag = null;
  const pl = $('player'); pl.style.transition = ''; pl.style.transform = '';
  const horiz = Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5;
  if (Math.abs(dx) > 10 || Math.abs(dy) > 10) { swiped = true; setTimeout(() => { swiped = false; }, 350); }
  if (zone === 'mini' && horiz) skip(dx < 0 ? 1 : -1);
  else if (zone === 'mini' && dy < -40 && Math.abs(dy) > Math.abs(dx)) { S.full = true; render(); }
  else if (zone === 'cover' && horiz) skip(dx < 0 ? 1 : -1);
  else if (zone !== 'mini' && top && dy > 110 && dy > Math.abs(dx)) collapse();
}
document.addEventListener('touchstart', e => { const t = e.touches[0]; dragStart(t.clientX, t.clientY, e.target); }, {passive:true});
document.addEventListener('touchmove', e => { const t = e.touches[0]; dragMove(t.clientX, t.clientY); }, {passive:true});
document.addEventListener('touchend', dragEnd);
document.addEventListener('touchcancel', () => { drag = null; const pl = $('player'); pl.style.transition = ''; pl.style.transform = ''; });
document.addEventListener('mousedown', e => { if (!e.button) dragStart(e.clientX, e.clientY, e.target); });
document.addEventListener('mousemove', e => { if (drag && e.buttons) dragMove(e.clientX, e.clientY); });
document.addEventListener('mouseup', dragEnd);

/* Some in-app viewers lay a phone page out at desktop width and shrink it. Detect that and scale the app back up. */
function fitPhone(){
  const app = $('app'), sw = screen.width;
  const shrunk = matchMedia('(pointer:coarse)').matches && sw < 700 && innerWidth > sw * 1.3;
  if (shrunk){
    const z = innerWidth / sw;
    app.classList.add('fit');
    app.style.zoom = z; app.style.width = (innerWidth / z) + 'px'; app.style.height = (innerHeight / z) + 'px';
    app.style.setProperty('--h', (innerHeight / z) + 'px');
  } else {
    app.classList.remove('fit');
    app.style.zoom = ''; app.style.width = '';
    /* Home-screen app on iPhone: with the see-through status bar, iOS makes the page shorter than the
       screen by the status bar height and iOS paints that strip dark. Drawing past it hides the tab bar, so instead
       mark the app "short": the tab bar drops its bottom padding and its colour matches the strip. */
    const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
    const full = innerWidth < innerHeight ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    app.style.height = '';
    app.classList.toggle('short', !!standalone && full - innerHeight > 20);
    app.style.setProperty('--h', app.clientHeight + 'px');
  }
}
fitPhone();
addEventListener('resize', fitPhone);
addEventListener('offline', () => toast('You’re offline', 'Your bought and downloaded mixes still play.'));
addEventListener('online', () => toast('Back online'));

function togglePlay(){
  if (S.progress >= 100) { play(S.now); return; }
  if (!S.playing && S.last !== S.now) { play(S.now, {keep:true}); return; }
  S.playing = !S.playing;
  if (S.playing && !timer) timer = setInterval(tick, 250);
  render();
}
function setVol(v, fromSlider){
  v = Math.max(0, Math.min(100, Math.round(v)));
  if (v > 0) S.lastVol = v;
  S.vol = v; audio.volume = v / 100;
  const sl = $('vol'); if (sl) { if (!fromSlider) sl.value = v; sl.style.setProperty('--p', v + '%'); }
  const mb = document.querySelector('[data-act=mute]'); if (mb) { mb.innerHTML = ic(v === 0 ? 'volMute' : 'vol'); mb.title = v === 0 ? 'Unmute' : 'Mute'; }
}

/* Right-click menu on any mix (desktop) */
function openCtx(id, x, y){
  const m = byId[id]; if (!m) return;
  const own = owns(id), item = (act, icon, label, extra = '') => `<button data-act="${act}" data-id="${id}" ${extra}>${ic(icon)}${label}</button>`;
  const html = [
    item('play', 'play', canPlay(id) ? 'Play' : `Play ${PV} preview`),
    item('queueadd', 'queue', 'Play next'),
    '<hr>',
    own ? item('download', 'dl', 'Download MP3') : item('buynow', 'tag', `Buy · $${unitPrice()}`),
    own ? '' : item('addcart', 'cart', inCart(id) ? 'Remove from cart' : 'Add to cart'),
    member() && !own ? item('save', S.saved.has(id) ? 'added' : 'add', S.saved.has(id) ? 'Remove from Your Library' : 'Add to Your Library') : '',
    '<hr>',
    item('open', 'browse', 'Go to mix'),
    item('share', 'share', 'Share'),
  ].join('');
  const box = $('ctx'); box.innerHTML = html; box.classList.add('on');
  const w = box.offsetWidth, h = box.offsetHeight;
  box.style.left = Math.min(x, innerWidth - w - 8) + 'px';
  box.style.top = Math.min(y, innerHeight - h - 8) + 'px';
}
function hideCtx(){ const box = $('ctx'); if (box && box.classList.contains('on')) { box.classList.remove('on'); box.innerHTML = ''; } }
document.addEventListener('contextmenu', e => {
  if (!isDesk() || !S.signedIn) return;
  const el = e.target.closest('[data-id]');
  if (!el || !byId[el.dataset.id] || e.target.closest('input')) return;
  e.preventDefault(); openCtx(el.dataset.id, e.clientX, e.clientY);
});
addEventListener('scroll', hideCtx, true);
addEventListener('resize', hideCtx);

/* Keyboard shortcuts (desktop) */
document.addEventListener('keydown', e => {
  if (!S.signedIn) return;
  const el = document.activeElement, typing = el && /INPUT|TEXTAREA/.test(el.tagName) && el.type !== 'range' && el.type !== 'checkbox';
  const mod = e.ctrlKey || e.metaKey;
  if (e.key === 'Escape') { hideCtx(); if (!$('sheet').hidden) closeSheet(); else if (S.full) collapse(); else if (typing) el.blur(); return; }
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); if (isDesk()) $('dq').focus(); else { S.tab = 'search'; S.stack = []; render(); if ($('q')) $('q').focus(); } return; }
  if (typing) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); return; }
  if (mod && e.key === 'ArrowRight') { e.preventDefault(); skip(1); return; }
  if (mod && e.key === 'ArrowLeft') { e.preventDefault(); skip(-1); return; }
  if (mod && e.key === 'ArrowUp') { e.preventDefault(); setVol(S.vol + 10); return; }
  if (mod && e.key === 'ArrowDown') { e.preventDefault(); setVol(S.vol - 10); return; }
});
/* Focusing the top-bar search opens Search, like Spotify */
document.addEventListener('focusin', e => { if (e.target.id === 'dq' && (S.tab !== 'search' || S.stack.length)) { S.tab = 'search'; S.stack = []; render(); } });

/* Drag the sidebar edge to resize it; drag it narrow to collapse */
document.addEventListener('mousedown', e => {
  if (e.target.id !== 'sdres') return;
  e.preventDefault();
  const app = $('app'), x0 = e.clientX, w0 = $('side').getBoundingClientRect().width, bar = e.target;
  bar.classList.add('drag');
  const mv = ev => {
    let w = w0 + ev.clientX - x0;
    if (w < 160) { if (!S.sideMin) { S.sideMin = true; app.classList.add('sidemin'); } return; }
    if (S.sideMin) { S.sideMin = false; app.classList.remove('sidemin'); }
    w = Math.max(220, Math.min(460, w)); lastW = w; app.style.setProperty('--lw', w + 'px');
  };
  const up = () => { removeEventListener('mousemove', mv); removeEventListener('mouseup', up); bar.classList.remove('drag'); render(); };
  addEventListener('mousemove', mv); addEventListener('mouseup', up);
});
deskMQ.addEventListener('change', () => render());
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && S.full && isDesk()) { S.full = false; render(); } });
render();
</script>
