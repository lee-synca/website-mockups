name: "ART: check Spotify + YouTube for new content"

on:
  schedule:
    # Once daily at 15:00 UTC = 3am NZST (4am during NZ daylight saving). Off-peak, and
    # A.R.T release only once a month, so a daily check is plenty. GitHub's scheduler is
    # best-effort (often 30-90 min late), which is fine at 3am.
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Spotify for new releases
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: node scripts/art-update-releases.mjs
      - name: Check YouTube for new music videos
        run: node scripts/art-update-videos.mjs
      - name: Commit and push if the site changed
        run: |
          if ! git diff --quiet; then
            git config user.name "art-site-bot"
            git config user.email "actions@github.com"
            git add art/index.html data/art-releases.json data/art-videos.json
            git commit -m "ART auto-update: new Spotify/YouTube content"
            git push
          else
            echo "No changes."
          fi
