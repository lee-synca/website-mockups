name: "ART: check Spotify for new releases"

on:
  schedule:
    # Daily at 22:00 UTC (~10am NZT) — catches each First Thursdays drop the morning after
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check for new releases
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: node scripts/art-update-releases.mjs
      - name: Commit and push if the site changed
        run: |
          if ! git diff --quiet; then
            git config user.name "art-site-bot"
            git config user.email "actions@github.com"
            git add art/index.html data/art-releases.json
            git commit -m "ART auto-update: new Spotify release(s)"
            git push
          else
            echo "No changes."
          fi
