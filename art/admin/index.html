<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A.R.T — Site Editor</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#e8367d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="64x64" href="../favicon-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#faf6f2; --card:#fff; --ink:#17121a; --ink2:#77697b;
      --coral:#ff4a63; --coral2:#ff7a45; --magenta:#e8367d;
      --line:rgba(23,18,26,.12); --line2:rgba(23,18,26,.18);
      --grad:linear-gradient(100deg,var(--magenta),var(--coral) 55%,var(--coral2));
      --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.5}
    h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em}
    button{font-family:var(--sans);cursor:pointer}
    input,textarea{font-family:var(--sans);font-size:15px;width:100%;padding:10px 13px;border:1px solid var(--line2);border-radius:10px;background:#fff;color:var(--ink);outline:none}
    input:focus,textarea:focus{border-color:var(--magenta)}
    textarea{resize:vertical;min-height:70px}
    label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin:0 0 5px}
    .wm{font-weight:700;color:var(--magenta);letter-spacing:-.02em}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:100px;font-weight:600;font-size:15px;border:0;transition:transform .12s ease,opacity .12s ease}
    .btn:active{transform:translateY(1px)}
    .btn--grad{background:var(--grad);color:#fff;box-shadow:0 10px 26px -10px rgba(232,54,125,.5)}
    .btn--ink{background:var(--ink);color:#fff}
    .btn--soft{background:#fff;color:var(--ink);border:1px solid var(--line2)}
    .btn--sm{height:34px;padding:0 14px;font-size:13px;border-radius:8px}
    .btn[disabled]{opacity:.5;cursor:default}

    /* login */
    .login{min-height:100vh;display:grid;place-items:center;padding:24px}
    .login__card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:40px;box-shadow:0 30px 70px -40px rgba(23,18,26,.3);text-align:center}
    .login__card h1{font-size:26px;margin:16px 0 6px}
    .login__card p{color:var(--ink2);font-size:14.5px;margin:0 0 22px}
    .login__err{color:var(--coral);font-size:13.5px;font-weight:600;margin-top:12px;min-height:18px}

    /* editor */
    header.top{position:sticky;top:0;z-index:10;background:rgba(250,246,242,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
    .top__row{max-width:820px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .tabs{max-width:820px;margin:0 auto;padding:0 20px;display:flex;gap:8px}
    .tab{height:42px;padding:0 20px;border-radius:100px 100px 0 0;border:0;background:transparent;color:var(--ink2);font-weight:600;font-size:15px}
    .tab--on{color:var(--magenta)}
    .wrap{max-width:820px;margin:0 auto;padding:22px 20px 140px}
    .entry{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
    .entry__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .entry__num{font-size:12.5px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.08em}
    .entry__tools{display:flex;gap:6px}
    .iconbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);background:#fff;color:var(--ink2);font-size:15px;line-height:1;display:grid;place-items:center}
    .iconbtn--del{color:var(--coral);border-color:rgba(255,74,99,.35)}
    .field{margin-bottom:12px}
    .imgrow{display:flex;gap:12px;align-items:center}
    .imgrow img{width:88px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#eee;flex:none}
    .savebar{position:fixed;left:0;right:0;bottom:0;background:rgba(250,246,242,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
    .savebar__row{max-width:820px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .status{font-size:13.5px;font-weight:600}
    .status--ok{color:#1a8f4a}.status--err{color:var(--coral)}.status--busy{color:var(--ink2)}
    .muted{color:var(--ink2);font-size:13.5px}
    .addbtn{width:100%;height:48px;border-radius:14px;border:1.5px dashed var(--line2);background:transparent;color:var(--ink2);font-weight:600;font-size:15px}
    .addbtn:hover{border-color:var(--magenta);color:var(--magenta)}
    .hide{display:none!important}
    /* auto-fill assist */
    .assist{background:linear-gradient(100deg,rgba(232,54,125,.06),rgba(255,122,69,.06));border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
    .assist__t{font-weight:600;font-size:14.5px;margin-bottom:10px}
    .assist__row{display:flex;gap:8px;flex-wrap:wrap}
    .assist__row input{flex:1;min-width:180px}
    .assist__file{display:inline-flex;align-items:center;gap:10px;cursor:pointer}
    .assist__file input{position:absolute;width:1px;height:1px;padding:0;opacity:0;overflow:hidden}
    .assist__hint{font-size:12.5px;color:var(--ink2);margin-top:8px}
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login" class="login">
    <div class="login__card">
      <div class="wm" style="font-size:24px">A·R·T</div>
      <h1>Site Editor</h1>
      <p>Add events &amp; news. Changes go live automatically.</p>
      <form id="loginForm">
        <input id="pw" type="password" placeholder="Editor password" autocomplete="current-password" aria-label="Editor password">
        <button class="btn btn--grad" type="submit" style="width:100%;margin-top:12px">Log in</button>
      </form>
      <div id="loginErr" class="login__err"></div>
    </div>
  </div>

  <!-- EDITOR -->
  <div id="editor" class="hide">
    <header class="top">
      <div class="top__row">
        <div class="wm" style="font-size:20px">A·R·T <span class="muted" style="font-weight:600">Editor</span></div>
        <button id="logout" class="btn btn--soft btn--sm">Log out</button>
      </div>
      <div class="tabs">
        <button class="tab tab--on" data-tab="events">Events</button>
        <button class="tab" data-tab="news">News</button>
      </div>
    </header>

    <div class="wrap">
      <div id="assist"></div>
      <div id="list"></div>
      <button id="add" class="addbtn">+ Add blank entry</button>
    </div>

    <div class="savebar">
      <div class="savebar__row">
        <span id="status" class="status muted">Loaded.</span>
        <button id="save" class="btn btn--grad">Save &amp; publish</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
